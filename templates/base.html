<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}腾声汇{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif;
            letter-spacing: 0;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-[#f7f9fc] text-slate-900">
    <header class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-5">
            <a href="{% url 'index' %}" class="font-bold text-slate-900">
                <span class="text-indigo-600">腾声汇</span>
                <span class="ml-2 text-sm font-medium text-slate-500">腾芳中学</span>
            </a>
            <a href="{% url 'index' %}" class="inline-flex h-10 items-center gap-2 rounded-md bg-slate-100 px-4 text-sm font-semibold text-slate-700 hover:bg-slate-200">
                <i class="fas fa-house"></i>
                <span>首页</span>
            </a>
        </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200 bg-white">
        <div class="mx-auto max-w-7xl px-4 py-5 text-sm text-slate-500">
            © {% now "Y" %} 腾芳中学
        </div>
    </footer>
</body>
</html>
